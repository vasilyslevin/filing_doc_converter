name: macOS package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/macos-package.yml"
      - "packaging/macos/**"
      - "src/source_doc_converter/**"
      - "pyproject.toml"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyside6
      ARCH: ${{ matrix.arch }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c packaging/macos/constraints-macos.txt -e ".[full,dev]"
          python -m pip install -c packaging/macos/constraints-macos.txt -r packaging/macos/requirements-build.txt

      - name: Lint
        run: ruff check .

      - name: Run packaging-related tests
        run: |
          pytest tests/test_packaging_entrypoints.py tests/test_runtime_paths.py tests/test_macos_packaging.py

      - name: Build macOS app bundle
        run: |
          chmod +x packaging/macos/build.sh packaging/macos/sign_and_notarize.sh
          ARCH=${{ matrix.arch }} ./packaging/macos/build.sh

      - name: Verify app bundle contents
        run: |
          APP_PATH="build/macos/dist/Source Document Converter.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Contents/MacOS/SourceDocumentConverter"
          test -f "$APP_PATH/Contents/MacOS/docling-tools"
          test -f "$APP_PATH/Contents/MacOS/ocrmypdf"
          test -f "$APP_PATH/Contents/Resources/LICENSE"
          test -f "$APP_PATH/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -f "$APP_PATH/Contents/Resources/PACKAGING_NOTES.txt"
          file "$APP_PATH/Contents/MacOS/SourceDocumentConverter" | grep -q "${{ matrix.arch }}"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Contents/Info.plist" | grep -q "Source Document Converter"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Contents/Info.plist" | grep -q "SourceDocumentConverter"

      - name: Smoke test packaged startup (no model downloads)
        run: |
          APP_EXEC="build/macos/dist/Source Document Converter.app/Contents/MacOS/SourceDocumentConverter"
          "$APP_EXEC" --package-smoke-test
          build/macos/dist/Source\ Document\ Converter.app/Contents/MacOS/docling-tools --runtime-check
          build/macos/dist/Source\ Document\ Converter.app/Contents/MacOS/docling-tools models download --help
          build/macos/dist/Source\ Document\ Converter.app/Contents/MacOS/ocrmypdf --version

      - name: Verify ad-hoc signature
        run: |
          APP_PATH="build/macos/dist/Source Document Converter.app"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Optionally sign and notarize
        if: ${{ secrets.MACOS_CERT_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_PRIVATE_KEY_BASE64 != '' }}
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          APP_PATH="build/macos/dist/Source Document Converter.app"
          ./packaging/macos/sign_and_notarize.sh "$APP_PATH" "${{ matrix.arch }}"

      - name: Upload macOS artifact files
        uses: actions/upload-artifact@v4
        with:
          name: SourceDocumentConverter-macOS-${{ matrix.arch }}
          path: |
            build/macos/dist/SourceDocumentConverter-macOS-${{ matrix.arch }}.zip
            build/macos/dist/SourceDocumentConverter-macOS-${{ matrix.arch }}.zip.sha256
            build/macos/dist/SourceDocumentConverter-macOS-${{ matrix.arch }}.dmg
            build/macos/dist/SourceDocumentConverter-macOS-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: warn
          retention-days: 14
