name: Windows development package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-package.yml"
      - "packaging/windows/**"
      - "src/filing_doc_converter/**"
      - "pyproject.toml"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read Tesseract lock metadata
        shell: pwsh
        run: |
          $Lock = Get-Content "packaging/windows/tesseract-bundle.lock.json" -Raw | ConvertFrom-Json
          $InstallerName = [System.IO.Path]::GetFileName("$($Lock.download_url)")
          "TESSERACT_LOCK_VERSION=$($Lock.version)" | Out-File $env:GITHUB_ENV -Append
          "TESSERACT_LOCK_SHA256=$($Lock.sha256.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append
          "TESSERACT_INSTALLER_NAME=$InstallerName" | Out-File $env:GITHUB_ENV -Append

      - name: Create Tesseract cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path "build/windows/tesseract/download" -Force | Out-Null

      - name: Cache pinned Tesseract installer
        uses: actions/cache@v4
        with:
          path: build/windows/tesseract/download/${{ env.TESSERACT_INSTALLER_NAME }}
          key: windows-tesseract-installer-${{ runner.os }}-${{ env.TESSERACT_LOCK_VERSION }}-${{ env.TESSERACT_LOCK_SHA256 }}

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full,dev]"
          python -m pip install -r packaging/windows/requirements-build.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build standalone folder
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Locate distribution
        shell: pwsh
        run: |
          $Distribution = Join-Path $PWD "build\windows\dist\FilingDocumentConverter"
          if (-not (Test-Path $Distribution -PathType Container)) {
            throw "PyInstaller distribution directory was not produced."
          }
          "DIST_DIR=$Distribution" | Out-File $env:GITHUB_ENV -Append

      - name: Verify package contents
        shell: pwsh
        run: |
          $RequiredFiles = @(
            "FilingDocumentConverter.exe",
            "docling-tools.exe",
            "ocrmypdf.exe",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "PACKAGING_NOTES.txt",
            "SHA256SUMS.txt",
            "tools\\tesseract\\tesseract.exe",
            "tools\\tesseract\\tessdata\\eng.traineddata",
            "tools\\tesseract\\tessdata\\osd.traineddata",
            "tools\\tesseract\\BUNDLE_INFO.txt"
          )
          foreach ($Name in $RequiredFiles) {
            $Path = Join-Path $env:DIST_DIR $Name
            if (-not (Test-Path $Path -PathType Leaf)) {
              throw "Missing package file: $Name"
            }
          }

      - name: Smoke test packaged executables
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          DO_NOT_TRACK: "1"
        run: |
          $GuiPath = Join-Path $env:DIST_DIR "FilingDocumentConverter.exe"
          $GuiProcess = Start-Process -FilePath $GuiPath -ArgumentList "--package-smoke-test" -Wait -PassThru
          if ($GuiProcess.ExitCode -ne 0) {
            throw "GUI package smoke test failed with exit code $($GuiProcess.ExitCode)."
          }
          & (Join-Path $env:DIST_DIR "docling-tools.exe") --help
          if ($LASTEXITCODE -ne 0) {
            throw "Docling tools help failed with exit code $LASTEXITCODE."
          }
          & (Join-Path $env:DIST_DIR "docling-tools.exe") models download --help
          if ($LASTEXITCODE -ne 0) {
            throw "Docling model-download help failed with exit code $LASTEXITCODE."
          }
          & (Join-Path $env:DIST_DIR "ocrmypdf.exe") --version
          if ($LASTEXITCODE -ne 0) {
            throw "OCRmyPDF companion failed with exit code $LASTEXITCODE."
          }
          $BundledTesseract = Join-Path $env:DIST_DIR "tools\\tesseract\\tesseract.exe"
          if (-not (Test-Path $BundledTesseract -PathType Leaf)) {
            throw "Bundled Tesseract executable is missing."
          }
          $env:TESSDATA_PREFIX = Join-Path $env:DIST_DIR "tools\\tesseract\\tessdata"
          & $BundledTesseract --version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Tesseract version check failed with exit code $LASTEXITCODE."
          }
          $Languages = & $BundledTesseract --list-langs 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Tesseract language listing failed with exit code $LASTEXITCODE."
          }
          if ($Languages -notcontains "eng" -or $Languages -notcontains "osd") {
            throw "Bundled Tesseract missing required language data (eng, osd)."
          }

      - name: Create ZIP artifact
        shell: pwsh
        run: |
          $ZipPath = Join-Path $PWD "FilingDocumentConverter-Windows-x64.zip"
          Compress-Archive -Path $env:DIST_DIR -DestinationPath $ZipPath -CompressionLevel Optimal
          "PACKAGE_ZIP=$ZipPath" | Out-File $env:GITHUB_ENV -Append

      - name: Upload unsigned development package
        uses: actions/upload-artifact@v4
        with:
          name: FilingDocumentConverter-Windows-x64
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          retention-days: 14
